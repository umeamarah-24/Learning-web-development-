<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form">
        <h2>Student Registration Form</h2>

        <form id="form">
            <label>Name</label>
            <input type="text" id="name" placeholder="Please enter your name"><br>
            <label>Email</label>
            <input type="email" id="email" placeholder="Please enter your email"><br>
            <label>Age</label>
            <input type="age" id="age" placeholder="Please enter your age"><br>
            <label>Course</label>
            <select id="course">
              <option value="">Please select your course</option>
              <option value="BSIT">BSIT</option>
              <option value="BSCS">BSCS</option>
              <option value="BSSE">BSSE</option>
              <option value="BSDS">BSDS</option>
            </select>
            <br>
            <label>Password</label>
            <input type="password" id=password" placeholder="Please enter your password"><br><br>
            <button type="submit">Register</button>
        </form>
    </div>

    <script>src="script.js"</script>
</body>
</html>
