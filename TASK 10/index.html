<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="counter-container">
        
            <h1>Counter</h1>
            
            <div class="counter-box">
                <p class="count-label">YOUR COUNT</p>
                <h2 id="count">0</h2>
            </div>
            <div class="button-group">
                <button class="increase" onclick="increaseCount()">+ Increase</button>
                <button class="decrease" onclick="decreaseCount()">- Decrease</button>
                <button class="plus-five" onclick="increaseFive()">Boost by 5</button>
                <button class="reset" onclick="resetCount()">Reset</button>
            </div>
        </div>

    <script src="script.js"></script>
</body>
</html>
